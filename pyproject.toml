# Development workspace for the two published packages:
#   core/  finnish-inflection-core  (import finnish_core), the shared library
#   cli/   finnish-inflection-cli   (import finnish_cli), the terminal app
[project]
name = "finnish-inflection-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["finnish-inflection-core", "finnish-inflection-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "cli"]

[tool.uv.sources]
finnish-inflection-core = { workspace = true }
finnish-inflection-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not integration' --import-mode=importlib"
testpaths = ["core/tests", "cli/tests"]
pythonpath = ["cli/tests"]
markers = [
    "integration: requires the real Finnish UralicNLP model",
]
