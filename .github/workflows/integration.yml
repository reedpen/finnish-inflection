name: Integration

# Tests against the real Finnish model (about 370 MB). They are too slow for
# every push, so run them weekly, on release tags, and on demand.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Real-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install both packages
        run: python -m pip install --upgrade pip && python -m pip install -e ./core -e ./cli pytest
      - name: Locate the model folder
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from importlib.metadata import version
          import uralicNLP
          print("path=" + os.path.join(os.path.dirname(uralicNLP.__file__), "models"))
          print("uralicnlp=" + version("uralicNLP"))
          PY
      - name: Restore the cached model
        uses: actions/cache@v4
        with:
          path: ${{ steps.model.outputs.path }}
          key: uralicnlp-fin-${{ steps.model.outputs.uralicnlp }}
      - name: Download the model if it isn't cached
        run: |
          python - <<'PY'
          from uralicNLP import uralicApi
          if not uralicApi.is_language_installed("fin"):
              uralicApi.download("fin")
          PY
      - name: Run the integration tests
        run: python -m pytest -m integration -v
      - name: Check the starter vocabulary against the model
        run: python -m finnish_core.starter.build --check --validate-model
