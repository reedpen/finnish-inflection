name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install both packages and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ./core -e ./cli pytest ruff==0.15.21
      - name: Check code quality
        run: ruff check core cli && ruff format --check core cli
      - name: Check the license copies match the root
        run: |
          for package in core cli; do
            cmp LICENSE "$package/LICENSE" && cmp NOTICE "$package/NOTICE"
          done
      - name: Run hermetic test suite
        run: python -m pytest

  distributions:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheels and source distributions
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ./core
          python -m finnish_core.starter.build --check
          python -m build core --outdir dist
          python -m build cli --outdir dist
      - name: Install wheels in an isolated environment
        run: |
          python -m venv /tmp/finnish-drill-smoke
          /tmp/finnish-drill-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed command and packaged data outside checkout
        working-directory: /tmp
        run: |
          /tmp/finnish-drill-smoke/bin/finnish-drill --help
          /tmp/finnish-drill-smoke/bin/finnish-drill --version
          /tmp/finnish-drill-smoke/bin/python - <<'PY'
          from importlib.resources import files
          from finnish_cli.store import load_book_of_mormon_vocab

          assert files("finnish_core.starter").joinpath("default_vocab.json").is_file()
          assert files("finnish_core.starter").joinpath("default_vocab.csv").is_file()
          nouns, verbs = load_book_of_mormon_vocab()
          assert nouns and verbs
          PY
